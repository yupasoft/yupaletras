<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Proyección · Yupaletras</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000">
<style>
/* Ventana de proyección de Yupaletras: va en la pantalla del proyector. No pide cuenta ni guarda nada:
   solo muestra lo que le manda la ventana de control (misma computadora, mismo navegador). */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif}
#esc{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
.frame{container-type:inline-size;aspect-ratio:16/9;width:min(100vw,177.78vh);overflow:hidden}
.slide{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;padding:4.5cqw 6cqw;overflow:hidden;
  background:var(--sbg,#000);color:var(--stx,#fff);font-family:var(--sff,Arial),Arial,sans-serif;font-weight:var(--sfw,700);text-align:var(--sal,center);text-shadow:var(--ssh,none)}
.slide .tx{white-space:pre;line-height:1.25;font-size:calc(var(--fs) * 0.078125cqw)}
.slide .au{margin-top:2cqw;opacity:.85;font-weight:400}
/* El fondo va en el marco, que no se vuelve a crear al cambiar de diapositiva: así un fondo con movimiento no se reinicia */
#stage{position:relative;background:var(--sbg,#000)}
#stage .slide{position:relative;z-index:2;background:transparent}
/* Video de fondo (de este equipo): queda puesto mientras cambian las diapositivas */
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#stage .osc{position:absolute;inset:0;z-index:1}
#dr{position:absolute;inset:0}
/* Escondido sigue dibujándose (invisible): así lo que se carga de antemano está de verdad listo al mostrarlo */
#dr[hidden]{display:block!important;opacity:0;pointer-events:none}
#dr iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;z-index:1;background:#000}
#dr iframe.on{opacity:1;z-index:2}
#visor{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:2;background:#000}
/* Video de la computadora: entero en pantalla, sin recortar */
#vd{position:absolute;inset:0;background:#000}
#vd video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
/* Ventana de la computadora (Zoom, PowerPoint abierto, una pestaña con Canva…): entera en pantalla, sin recortar */
#vn{position:absolute;inset:0;background:#000}
#vn video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
/* Foto de la computadora: entera en pantalla, sin recortar */
#ft{position:absolute;inset:0;background:#000}
#ft img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
/* Tapa: evita que un clic en esta ventana avance la presentación por su cuenta y la desacomode del control */
#tapa{position:absolute;inset:0;z-index:5}
#negro{position:absolute;inset:0;z-index:6;background:#000}
/* Sin nada proyectado: fondo azul con una cruz blanca muy suave en el centro (al 6 %), que crece y se achica con la ventana.
   Sin textos ni botones: la pantalla completa se pone con doble clic, con la tecla F o con F11. */
#guia{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:#0C1A2E}
#guia svg{display:block;width:min(100vw,100vh);height:min(100vw,100vh);opacity:.06}
#guia small{position:absolute;left:0;right:0;bottom:24px;padding:0 24px;text-align:center;color:#9BB0C9;font-size:15px}
[hidden]{display:none!important}
.sinraton,.sinraton *{cursor:none!important}
</style>
</head>
<body>
<div id="esc">
  <div class="frame" id="stage" hidden></div>
  <div id="dr" hidden></div>
  <div id="vd" hidden></div>
  <div id="vn" hidden></div>
  <div id="ft" hidden></div>
  <div id="tapa"></div>
  <div id="negro" hidden></div>
  <div id="guia">
    <svg viewBox="0 0 1300 1300" aria-hidden="true"><path fill="#fff" d="M610 340h80v180h145v80H690v360h-80V600H465v-80h145z"/></svg>
    <small id="estado" hidden></small>
  </div>
</div>
<script src="videos.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const canal = 'BroadcastChannel' in window ? new BroadcastChannel('yl_proyector') : null;
const decir = m => { if (canal) canal.postMessage(m); };
let hay = false;      // hay algo en pantalla

/* ---------- Canción (el control manda el texto y el estilo ya calculados) ---------- */
const VARS = ['--sbg', '--stx', '--sff', '--sfw', '--sal', '--ssh'], puesto = {};
/* Video de fondo: se lee del almacén de este equipo. Si no está, queda el fondo normal (un cuadro del video o el color). */
let vidId = null, vidUrl = null;
function quitarVideo() {
  vidId = null; $('stage').querySelectorAll('video,.osc').forEach(x => x.remove());
  if (vidUrl) { URL.revokeObjectURL(vidUrl); vidUrl = null; }
}
function ponerVideo(v) {
  if (!v || !v.id || !window.YLVideos) { quitarVideo(); return; }
  const osc = Math.max(0, Math.min(0.85, +v.osc || 0));
  if (vidId === v.id) { const o = $('stage').querySelector('.osc'); if (o) o.style.background = 'rgba(0,0,0,' + osc + ')'; return; }
  quitarVideo(); vidId = v.id;
  YLVideos.archivo(v.id).then(b => {
    if (vidId !== v.id || !b) return;
    const st = $('stage'), e = document.createElement('video'), o = document.createElement('div');
    e.muted = true; e.loop = true; e.autoplay = true; e.playsInline = true; e.setAttribute('tabindex', '-1');
    vidUrl = URL.createObjectURL(b); e.src = vidUrl;
    o.className = 'osc'; o.style.background = 'rgba(0,0,0,' + osc + ')';
    st.insertBefore(o, st.firstChild); st.insertBefore(e, st.firstChild);
    const p = e.play(); if (p && p.catch) p.catch(() => { });
  }).catch(() => { });
}
function cancion(m) {
  const st = $('stage'); st.querySelectorAll('.slide').forEach(x => x.remove());
  ponerVideo(m.video);
  VARS.forEach(k => { const v = m.vars && m.vars[k]; if (typeof v === 'string' && puesto[k] !== v) { puesto[k] = v; st.style.setProperty(k, v); } });      // el fondo no se vuelve a poner si es el mismo
  const d = document.createElement('div'); d.className = 'slide';
  for (const p of (m.partes || [])) {
    const t = document.createElement('div'); t.className = 'tx' + (p.au ? ' au' : ''); t.textContent = String(p.txt || '');
    t.style.setProperty('--fs', +p.fs || 40); d.appendChild(t);
  }
  st.appendChild(d);
  quitarPeli(); soltarDrive(); quitarVisor(); st.hidden = false; $('dr').hidden = true;
}

/* ---------- Presentación de Google: cada diapositiva es una carga aparte, así que se tiene lista la vecina ---------- */
/* Para que el cambio sea instantáneo se tienen cargadas de antemano varias diapositivas (más hacia adelante que hacia atrás):
   pasar a una que ya está lista es solo mostrarla. Si la lista de reproducción sigue con otra presentación, su primera
   diapositiva también se va cargando (pre). */
const ATRAS = 2, ADELANTE = 6, JUNTAS = 3;      // cuántas se guardan a cada lado y cuántas cargan a la vez
const pool = new Map(); let dv = null, pre = null;
const esDocs = u => typeof u === 'string' && /^https:\/\/docs\.google\.com\/presentation\/d\/(e\/)?[\w-]+\/embed\?[\w=&.-]*$/.test(u);
function marco(base, k) {
  const f = document.createElement('iframe'), o = { f, listo: false };
  f.setAttribute('tabindex', '-1'); f.title = 'Diapositiva ' + k;
  f.addEventListener('load', () => setTimeout(() => { o.listo = true; mostrar(); }, 1200));      // deja terminar la entrada de la diapositiva
  f.src = base + '#slide=' + k;
  $('dr').appendChild(f); return o;
}
function soltarDrive() { pool.forEach(o => o.f.remove()); pool.clear(); dv = null; }
function vecinas() {      // por cercanía, primero las de adelante
  const r = [], ad = dv.total ? ADELANTE : 2;      // sin saber cuántas tiene, no se piden muchas de más
  for (let d = 1; d <= ad; d++) {
    if (!dv.total || dv.n + d <= dv.total) r.push(dv.n + d);
    if (d <= ATRAS && dv.n - d >= 1) r.push(dv.n - d);
  }
  return r;
}
function mostrar() {
  if (!dv) return;
  if (!pool.has(dv.n)) pool.set(dv.n, marco(dv.base, dv.n));
  if (pool.get(dv.n).listo) { dv.vista = dv.n; pool.forEach((x, k) => x.f.classList.toggle('on', k === dv.n)); }      // mientras carga, sigue a la vista la anterior (sin parpadeo a negro)
  const q = vecinas();
  pool.forEach((x, k) => { if (k !== dv.n && k !== dv.vista && !q.includes(k)) { x.f.remove(); pool.delete(k); } });
  let c = 0; pool.forEach(x => { if (!x.listo) c++; });
  for (const k of q) { if (c >= JUNTAS) break; if (!pool.has(k)) { pool.set(k, marco(dv.base, k)); c++; } }
}
function drive(m) {
  if (!esDocs(m.base)) return;
  quitarVideo(); quitarPeli();
  const n = Math.max(1, Math.floor(+m.n || 1));
  if (!dv || dv.base !== m.base) {
    soltarDrive(); dv = { base: m.base, n, total: 0, vista: 0 };
    if (pre && pre.base === m.base && n === 1) { pool.set(1, pre.o); pre = null; }      // ya venía cargándose
  }
  dv.n = n; dv.total = Math.floor(+m.total || 0);
  quitarVisor(); $('stage').hidden = true; $('dr').hidden = false;
  mostrar();
}
function siguiente(base) {      // la presentación que sigue en la lista de reproducción
  if (!esDocs(base) || (dv && dv.base === base)) base = null;
  if (pre && pre.base === base) return;
  if (pre) { pre.o.f.remove(); pre = null; }
  if (base) pre = { base, o: marco(base, 1) };
}

/* ---------- Otro archivo de Drive (visor de Google): se maneja en esta misma ventana ---------- */
const esVisor = u => typeof u === 'string' && /^https:\/\/drive\.google\.com\/file\/d\/[\w-]+\/preview$/.test(u);
function quitarVisor() { const v = $('visor'); if (v) v.remove(); $('tapa').hidden = false; }
function visor(m) {
  if (!esVisor(m.url)) return;
  quitarVideo(); quitarPeli(); soltarDrive(); quitarVisor(); $('stage').hidden = true; $('dr').hidden = true;
  const f = document.createElement('iframe'); f.id = 'visor'; f.title = 'Presentación'; f.allow = 'fullscreen; autoplay'; f.src = m.url;
  $('esc').appendChild(f); $('tapa').hidden = true;      // sin tapa: hay que poder desplazarlo aquí
}

/* ---------- Video de la computadora: el control manda el archivo; aquí se reproduce y se avisa por dónde va ---------- */
let pk = null, pv = null, pUrl = null, pMudo = false;
function informar(extra) { if (pv) decir(Object.assign({ t: 'vt', vk: pk, cur: pv.currentTime || 0, dur: isFinite(pv.duration) ? pv.duration : 0, pausa: pv.paused || pv.ended, mudo: pMudo }, extra || {})); }
function quitarPeli() {
  if (pv) { const v = pv; pv = null; try { v.pause(); } catch (e) { } v.removeAttribute('src'); try { v.load(); } catch (e) { } v.remove(); }
  if (pUrl) { URL.revokeObjectURL(pUrl); pUrl = null; }
  pk = null; pMudo = false; $('vd').hidden = true;
}
// El navegador puede negar el sonido si en esta ventana aún no se hizo ningún clic: entonces arranca sin sonido y se avisa al control
function tocar() {
  const v = pv, p = v.play(); if (!p || !p.catch) return;
  p.catch(e => {
    if (v !== pv || !e || e.name !== 'NotAllowedError' || v.muted) return;
    v.muted = true; pMudo = true; const q = v.play(); if (q && q.catch) q.catch(() => { }); informar();
  });
}
function conSonido() { if (pv && pMudo) { pv.muted = false; pMudo = false; informar(); } }
function peli(m) {
  if (!(m.archivo instanceof Blob) || typeof m.vk !== 'string') return;
  quitarVideo(); soltarDrive(); quitarVisor(); $('stage').hidden = true; $('dr').hidden = true;
  if (pk === m.vk && pv) {      // el mismo video: solo cambia pausa o repetir
    pv.loop = !!m.bucle;
    const quieto = pv.paused || pv.ended;
    if (m.pausa && !quieto) pv.pause();
    else if (!m.pausa && quieto) { if (pv.ended) pv.currentTime = 0; tocar(); }
    return;
  }
  quitarPeli(); pk = m.vk; $('vd').hidden = false;
  const v = pv = document.createElement('video'); let ult = 0;
  v.playsInline = true; v.preload = 'auto'; v.loop = !!m.bucle; v.setAttribute('tabindex', '-1');
  v.addEventListener('timeupdate', () => { const a = Date.now(); if (v === pv && a - ult > 400) { ult = a; informar(); } });
  ['play', 'pause', 'ended', 'loadedmetadata', 'durationchange', 'seeked'].forEach(n => v.addEventListener(n, () => { if (v === pv) informar(); }));
  v.addEventListener('error', () => { if (v === pv) informar({ error: true }); });
  pUrl = URL.createObjectURL(m.archivo); v.src = pUrl; $('vd').appendChild(v);
  if (!m.pausa) tocar();
}

/* ---------- Ventana de la computadora: lo que se ve en una ventana o pestaña elegida en el control (Zoom, PowerPoint, Canva…).
   La imagen en vivo no viaja por el canal: el control la entrega llamando a ylVentana() de esta ventana (misma computadora y
   mismo navegador). Se muestra a su tamaño real, sin volver a comprimirla. El sonido sigue saliendo por su propio programa. ---------- */
let vnk = null;
function quitarVentana() { vnk = null; const v = $('vn').querySelector('video'); if (v) { v.srcObject = null; v.remove(); } $('vn').hidden = true; }
window.ylVk = () => vnk;
window.ylVentana = (flujo, vk) => {
  quitarVentana(); vnk = vk;
  const v = document.createElement('video'); v.muted = true; v.autoplay = true; v.playsInline = true; v.setAttribute('tabindex', '-1');
  v.srcObject = flujo; $('vn').appendChild(v); $('vn').hidden = false;
  const q = v.play(); if (q && q.catch) q.catch(() => { });
};
function ventana(m) {
  quitarVideo(); quitarPeli(); soltarDrive(); quitarVisor(); $('stage').hidden = true; $('dr').hidden = true;
  if (vnk !== m.vk) { quitarVentana(); decir({ t: 'pidevn', vk: m.vk }); }      // esta ventana se recargó o aún no la recibió: se la pide al control
}

/* ---------- Foto de la computadora: el control manda el archivo. La anterior sigue a la vista hasta que la nueva está lista ---------- */
let fk = null, fUrl = null;
function quitarFoto() { fk = null; $('ft').textContent = ''; $('ft').hidden = true; if (fUrl) { URL.revokeObjectURL(fUrl); fUrl = null; } }
function foto(m) {
  if (!(m.archivo instanceof Blob) || typeof m.fk !== 'string') return;
  quitarVideo(); quitarPeli(); soltarDrive(); quitarVisor(); $('stage').hidden = true; $('dr').hidden = true; $('ft').hidden = false;
  if (fk === m.fk) return;
  fk = m.fk;
  const url = URL.createObjectURL(m.archivo), im = new Image(); im.alt = '';
  const lista = () => {
    if (fk !== m.fk) { URL.revokeObjectURL(url); return; }
    $('ft').replaceChildren(im); if (fUrl) URL.revokeObjectURL(fUrl); fUrl = url;
  };
  im.src = url; (im.decode ? im.decode() : Promise.resolve()).then(lista, lista);
}

if (canal) canal.onmessage = e => {
  const m = e.data || {};
  if (m.t === 'vcmd') { if (pv && m.vk === pk && m.c === 'ir') { try { pv.currentTime = Math.max(0, Math.min(isFinite(pv.duration) ? pv.duration : 1e9, +m.s || 0)); } catch (x) { } } return; }
  if (m.t === 'ping') { decir({ t: 'hola' }); return; }
  if (m.t === 'cerrar') { window.close(); return; }
  if (m.t !== 'ventana') quitarVentana();
  if (m.t === 'nada') { hay = false; quitarVideo(); quitarPeli(); quitarFoto(); soltarDrive(); siguiente(null); quitarVisor(); $('stage').hidden = true; $('dr').hidden = true; $('negro').hidden = true; $('guia').hidden = false; return; }
  if (m.t === 'cancion') cancion(m); else if (m.t === 'drive') drive(m); else if (m.t === 'visor') visor(m); else if (m.t === 'video') peli(m); else if (m.t === 'foto') foto(m); else if (m.t === 'ventana') ventana(m); else return;
  if (m.t !== 'foto') quitarFoto();
  siguiente(m.prox);
  hay = true; $('guia').hidden = true; $('negro').hidden = !m.negro;
};
else { $('estado').textContent = 'Este navegador no permite conectar las dos ventanas. Usa Chrome o Edge.'; $('estado').hidden = false; }

/* ---------- Pantalla completa y teclas ---------- */
function completa() { if (document.fullscreenElement) document.exitFullscreen().catch(() => { }); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => { }); }
document.addEventListener('dblclick', completa);
document.addEventListener('pointerdown', conSonido);
document.addEventListener('keydown', e => {
  conSonido();
  // F11 se atiende aquí (no lo hace el navegador): así de esa pantalla completa también se sale con Esc
  if (e.key === 'f' || e.key === 'F' || e.key === 'F11') { if (!e.repeat) completa(); e.preventDefault(); return; }
  if (['ArrowRight', 'ArrowLeft', 'ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', ' ', 'Enter', 'Backspace', 'Home', 'End', 'b', 'B', '.'].includes(e.key)) { decir({ t: 'tecla', k: e.key }); e.preventDefault(); }
});
let rt = 0;
document.addEventListener('mousemove', () => { document.body.classList.remove('sinraton'); clearTimeout(rt); rt = setTimeout(() => document.body.classList.add('sinraton'), 2500); });
window.addEventListener('pagehide', () => decir({ t: 'adios' }));
decir({ t: 'hola' });
</script>
</body>
</html>
